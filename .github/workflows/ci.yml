name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            tools/eslint/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Install ESLint
        run: npm ci --prefix tools/eslint

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Run Cloud Functions tests
        run: npm --prefix functions test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      # Los emuladores de Firebase (reglas y e2e) necesitan Java; los binarios se cachean entre ejecuciones
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Run Firestore security rules tests
        run: npm run test:rules

      # La cola de alarmas push y su envío (con un FCM simulado), contra el emulador de Firestore
      - name: Run push alarm tests
        run: npm run test:push

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # El emulador de Functions carga functions/.env.local (no versionado); en CI lleva valores de ejemplo
      - name: Write demo Cloud Functions params for the emulator
        run: printf 'ANDROID_PACKAGE_NAME=org.example.neuroproductividad\n' > functions/.env.local

      - name: Run end-to-end tests
        run: npm run test:e2e

  deploy:
    name: Deploy to Firebase
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Un solo deploy a la vez; los merges seguidos esperan en cola en lugar de cancelarse
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # Workload Identity Federation: token temporal por ejecución, sin claves de cuenta de servicio
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # functions/.env.<project-id> no se versiona; en CI los parámetros salen de las variables y los secretos
      # del repositorio. El email de la administración va en un secreto para que no aparezca en los logs. La
      # contraseña del buzón que envía los correos no pasa por aquí: está en Secret Manager (SMTP_PASSWORD).
      - name: Write Cloud Functions params
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_SHA256_FINGERPRINT: ${{ vars.ANDROID_SHA256_FINGERPRINT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Buzón que envía los avisos y recibe las respuestas (p. ej. info@clar.life); SMTP_HOST es opcional
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          # Opcional: dirección pública de la app en los emails (p. ej. https://clar.life)
          APP_URL: ${{ vars.APP_URL }}
          # Opcional: id del cliente OAuth de Google para sincronizar con Google Calendar (no es secreto; el secreto
          # del cliente está en Secret Manager como GOOGLE_OAUTH_CLIENT_SECRET)
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          for name in ANDROID_PACKAGE_NAME ANDROID_SHA256_FINGERPRINT ADMIN_EMAIL SMTP_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta la variable o el secreto de repositorio $name"
              exit 1
            fi
          done
          # Todos los parámetros van en el archivo: en modo no interactivo, el CLI no usa los valores por defecto del
          # código y falla si falta alguno. Sin la variable SMTP_HOST, el servidor de IONOS.
          printf 'ANDROID_PACKAGE_NAME=%s\nANDROID_SHA256_FINGERPRINT=%s\nADMIN_EMAIL=%s\nSMTP_USER=%s\nSMTP_HOST=%s\nAPP_URL=%s\nGOOGLE_OAUTH_CLIENT_ID=%s\n' \
            "$ANDROID_PACKAGE_NAME" "$ANDROID_SHA256_FINGERPRINT" "$ADMIN_EMAIL" "$SMTP_USER" "${SMTP_HOST:-smtp.ionos.es}" "$APP_URL" \
            "$GOOGLE_OAUTH_CLIENT_ID" > functions/.env

      # Los predeploy de firebase.json compilan la SPA y las Cloud Functions antes de subirlas.
      # firebase-tools sale de devDependencies (versión fijada en package.json).
      - name: Deploy Hosting, Cloud Functions and Firestore rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # Clave pública VAPID de Firebase Cloud Messaging (Configuración del proyecto → Cloud Messaging → Certificados
          # web push), para las notificaciones push de las alarmas. Es pública: va en una variable, no en un secreto.
          # Sin ella, la app se compila sin push y las alarmas avisan solo con CLAR abierta.
          VITE_FCM_VAPID_KEY: ${{ vars.FCM_VAPID_KEY }}
          # Id del cliente OAuth de Google (público). Sin él, la app no ofrece conectar Google Calendar
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: npx firebase deploy --only hosting,functions,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
